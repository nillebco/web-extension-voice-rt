<!DOCTYPE html>
<html>

<head>
  <title>Speak with the web page</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
  <h1>&#x26A1; Speak with the web page</h1>
  <h2>&#x2699;&#xFE0F; Settings</h2>

  <div class="setting-row">
    <label for="apiKey">OpenAI API Key</label>
    <input type="password" id="apiKey" placeholder="Enter your API key" value="********">
  </div>

  <div class="setting-row">
    <label for="keyServer">Key Server</label>
    <input type="text" id="keyServer" placeholder="Enter key server URL (optional)">
  </div>

  <div class="setting-row">
    <label for="voice">Voice</label>
    <select id="voice" class="combo-box">
      <option value="alloy">Alloy</option>
      <option value="ash">Ash</option>
      <option value="ballad">Ballad</option>
      <option value="coral">Coral</option>
      <option value="echo">Echo</option>
      <option value="sage">Sage</option>
      <option value="shimmer">Shimmer</option>
      <option value="verse">Verse</option>
    </select>
  </div>

  <h2>&#x1F680; Actions</h2>

  <div class="actions-container">
    <button id="generateReaderContent" class="action-button">Display Reader mode</button>
    <button id="start" class="action-button">Start speaking</button>
    <button id="stop" class="action-button">Stop speaking</button>
  </div>

  <script src="polyfill.js"></script>
  <script src="popup.js"></script>
</body>

</html>
